<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Memory | MEMORIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans">

    <!-- Navbar -->
    <nav class="p-5 bg-gray-800">
        <div class="flex items-center justify-between">
            <div class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-700">
                MEMORIA
            </div>
            <div>
                <a href="dashboard.html" class="text-white text-lg mx-4 hover:text-purple-500">Dashboard</a>
                <a href="timeline.html" class="text-white text-lg mx-4 hover:text-purple-500">Timeline</a>
                <a href="signin.html" class="text-white text-lg mx-4 hover:text-purple-500">Sign Out</a>
            </div>
        </div>
    </nav>

    <!-- Add Memory Form -->
    <section class="px-5 py-10">
        <h2 class="text-3xl font-semibold text-center mb-6">Add a New Memory</h2>
        <div class="max-w-xl mx-auto bg-gray-800 p-8 rounded-lg shadow-lg">
            <form>
                <div class="mb-4">
                    <label for="memoryTitle" class="block text-left text-sm text-gray-400">Memory Title</label>
                    <input type="text" id="memoryTitle" placeholder="e.g., My First Concert" class="w-full p-3 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-600">
                </div>
                <div class="mb-4">
                    <label for="memoryDate" class="block text-left text-sm text-gray-400">Date of Memory</label>
                    <input type="date" id="memoryDate" class="w-full p-3 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-600">
                </div>
                <div class="mb-4">
                    <label for="memoryDescription" class="block text-left text-sm text-gray-400">Memory Description</label>
                    <textarea id="memoryDescription" placeholder="Describe this memory" rows="4" class="w-full p-3 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-600"></textarea>
                </div>
                
                <!-- Visibility Option -->
                <div class="mb-4">
                    <label for="memoryVisibility" class="block text-left text-sm text-gray-400">Visibility</label>
                    <select id="memoryVisibility" class="w-full p-3 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-600">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                        <option value="friends">Friends Only</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-500 text-white rounded-md font-semibold hover:bg-gradient-to-l">
                    Save Memory
                </button>
            </form>
        </div>
    </section>

</body>
</html>
