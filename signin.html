<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MEMORIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Sign-in form submission handler
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.querySelector("form");
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                // Example: Simulate authentication by checking hardcoded credentials
                if (email === "user@example.com" && password === "password123") {
                    window.location.href = "dashboard.html"; // Redirect to dashboard after successful sign-in
                } else {
                    alert("Invalid email or password.");
                }
            });
        });
    </script>
</head>
<body class="bg-black text-white font-sans">
    <section class="flex flex-col items-center justify-center h-screen text-center space-y-6">
        <!-- App Name -->
        <div class="absolute top-5 left-5 text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-700">
            MEMORIA
        </div>
        <!-- Form -->
        <div class="w-full max-w-md bg-gray-800 p-8 rounded-lg shadow-lg">
            <h2 class="text-3xl mb-6 font-semibold">Sign In</h2>
            <form>
                <div class="mb-4">
                    <label for="email" class="block text-left text-sm text-gray-400">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" class="w-full p-3 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-600">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-left text-sm text-gray-400">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" class="w-full p-3 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-600">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-500 text-white rounded-md font-semibold hover:bg-gradient-to-l">
                    Sign In
                </button>
            </form>
            <div class="mt-6 text-sm text-gray-400">
                <p>Don't have an account? <a href="signup.html" class="text-purple-400 hover:text-purple-600">Sign Up</a></p>
            </div>
        </div>
    </section>
</body>
</html>
